name: validate

on:
  push:
    paths:
      - 'core.json'
      - 'build.ps1'
      - 'web/core-data.js'
      - 'web/core-lib.js'
      - 'tests/**'
      - 'scripts/**'
      - 'schema/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'core.json'
      - 'build.ps1'
      - 'web/core-data.js'
      - 'web/core-lib.js'
      - 'tests/**'
      - 'scripts/**'
      - 'schema/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild core-data.js from core.json
        shell: pwsh
        run: ./build.ps1

      - name: Validate core schema & references
        run: node scripts/validate-core.js

      - name: Run matcher & optimizer regression tests
        run: node tests/run-tests.js

      - name: Semantic sync check (order-insensitive)
        shell: bash
        run: |
          git show HEAD:web/core-data.js > /tmp/committed-core-data.js
          node <<'EOF'
          const fs = require('fs');
          function extract(text) {
            const m = text.match(/window\.PROMPT_ATLAS\s*=\s*([\s\S]*?);\s*$/);
            if (!m) throw new Error('window.PROMPT_ATLAS payload not found');
            return JSON.parse(m[1]);
          }
          function canon(v) {
            if (Array.isArray(v)) return v.map(canon);
            if (v && typeof v === 'object') {
              const out = {};
              for (const k of Object.keys(v).sort()) out[k] = canon(v[k]);
              return out;
            }
            return v;
          }
          const committed = extract(fs.readFileSync('/tmp/committed-core-data.js', 'utf8'));
          const rebuilt = extract(fs.readFileSync('web/core-data.js', 'utf8'));
          const a = JSON.stringify(canon(committed));
          const b = JSON.stringify(canon(rebuilt));
          if (a !== b) {
            console.error('::error::web/core-data.js is out of sync with core.json. Run ./build.ps1 locally and commit the result.');
            process.exit(1);
          }
          console.log('core-data.js is in sync with core.json (' + rebuilt.atoms.length + ' atoms)');
          EOF
