name: validate

on:
  push:
    paths:
      - 'core.json'
      - 'build.ps1'
      - 'web/core-data.js'
  pull_request:
    paths:
      - 'core.json'
      - 'build.ps1'
      - 'web/core-data.js'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild core-data.js from core.json
        shell: pwsh
        run: ./build.ps1

      - name: Check core-data.js is in sync
        run: |
          git diff --exit-code -- web/core-data.js \
            || (echo "::error::web/core-data.js is out of sync with core.json. Run ./build.ps1 locally and commit the result." && exit 1)
