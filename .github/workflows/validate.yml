name: validate

on:
  push:
    paths:
      - 'core.json'
      - 'build.ps1'
      - 'web/core-data.js'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'core.json'
      - 'build.ps1'
      - 'web/core-data.js'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and semantic sync check
        shell: pwsh
        run: |
          $file = "web/core-data.js"
          $committedRaw = git show "HEAD:$file"
          ./build.ps1
          $rebuiltRaw = Get-Content $file -Raw
          function Get-Payload($s) {
            $m = [regex]::Match($s, 'window\.PROMPT_ATLAS\s*=\s*([\s\S]*?);\s*$')
            if (-not $m.Success) { throw "cannot locate window.PROMPT_ATLAS payload" }
            return $m.Groups[1].Value
          }
          $c = Get-Payload $committedRaw | ConvertFrom-Json | ConvertTo-Json -Depth 12 -Compress
          $r = Get-Payload $rebuiltRaw | ConvertFrom-Json | ConvertTo-Json -Depth 12 -Compress
          if ($c -ne $r) {
            Write-Host "::error::web/core-data.js is out of sync with core.json. Run ./build.ps1 locally and commit the result."
            exit 1
          }
          $atomsCount = (Get-Payload $rebuiltRaw | ConvertFrom-Json).atoms.Count
          Write-Host "core-data.js is in sync with core.json ($atomsCount atoms)"
